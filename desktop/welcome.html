<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bridgain 서버 연결</title>
    <link rel="stylesheet" href="welcome.css" />
  </head>
  <body>
    <main>
      <span>bridgain.</span>
      <h1>작업할 서버에 연결하세요</h1>
      <p>
        개발자 웹 주소를 입력하면 기존 계정으로 로그인할 수 있어요. AI 연결은
        로그인 후 필요할 때 설정합니다.
      </p>
      <form id="server-form">
        <label for="server">개발자 웹 주소</label
        ><input
          id="server"
          type="url"
          placeholder="https://developer.example.com"
          required
        /><small>로컬 개발 환경: http://localhost:15174</small
        ><button>서버 연결</button>
        <p id="error" role="alert"></p>
      </form>
    </main>
    <script src="welcome.js"></script>
  </body>
</html>
